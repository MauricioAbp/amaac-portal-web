<section class="about" id="nosotros" aria-labelledby="about-title">
  <div class="about__inner">
    <div class="about__image-wrap"><img [src]="content.imageUrl" [alt]="content.imageAlt" loading="lazy"></div>
    <div class="about__content">
      <p class="section-kicker">{{ content.kicker }}</p>
      <h2 id="about-title">{{ content.title }}</h2>
      <p>{{ content.description }}</p>
      <a routerLink="/" fragment="campanas">{{ content.linkLabel }} <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span></a>
    </div>
  </div>
</section>
